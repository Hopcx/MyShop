# ingress-nginx: TLS 1.3, rate limit ở edge, ModSecurity + OWASP CRS làm WAF.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myshop
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
spec:
  ingressClassName: nginx
  tls:
    - hosts: [shop.example.com, api.shop.example.com]
      secretName: myshop-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: myshop-web, port: { number: 80 } } } }
    - host: api.shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: myshop-api, port: { number: 80 } } } }
---
# Chỉ Ingress, Prometheus và web được gọi vào API.
# Lưu ý: /metrics và /openapi vẫn đi qua Ingress host api.* — chặn bằng rule WAF (CRS custom rule) hoặc tách metrics sang cổng riêng.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myshop-api-ingress
spec:
  podSelector: { matchLabels: { app: myshop-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
        - podSelector: { matchLabels: { app: myshop-web } }
      ports: [{ port: 8080 }]
