apiVersion: v1
kind: Secret
metadata:
  name: myshop-api-secrets
type: Opaque
stringData:
  ConnectionStrings__Shop: "Server=<sql-host>;Database=MyShop;User Id=<user>;Password=<password>;Encrypt=True"
  ConnectionStrings__Redis: "<redis-host>:6380,ssl=true,password=<password>"
  Jwt__SigningKey: "<random ≥ 48 bytes>"
  Webhooks__Secrets__vnpay: "<webhook secret>"
  Webhooks__Secrets__ghn: "<webhook secret>"
  Smtp__Host: "<smtp host>"
  Smtp__User: "<smtp user>"
  Smtp__Password: "<smtp password>"
